<!DOCTYPE html>
<html lang="{{ section.lang | default(value=config.default_language) }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta property="og:title" content="{{ config.title }}">
  <meta property="og:description" content="{{ config.description }}">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=UnifrakturCook:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
  <script>if(localStorage.getItem('theme')!=='light')document.documentElement.classList.add('dark');</script>
  <script>
    (function () {
      if (!localStorage.getItem('lang-redirected')) {
        localStorage.setItem('lang-redirected', '1');
        var lang = (navigator.language || '').toLowerCase();
        if (lang.startsWith('it') && !location.pathname.startsWith('/it')) {
          location.replace('/it/');
        }
      }
    })();
  </script>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
